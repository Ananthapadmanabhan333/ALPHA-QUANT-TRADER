[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-quant-backend"
version = "1.0.0"
description = "ALPHA Quant Institutional Trading Platform - Backend Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "starlette==0.38.6",
    "SQLAlchemy==2.0.35",
    "asyncpg==0.29.0",
    "psycopg[binary]==3.2.3",
    "alembic==1.13.3",
    "greenlet==3.1.0",
    "aiosqlite==0.20.0",
    "structlog==24.4.0",
    "python-json-logger==2.0.7",
    "python-dotenv==1.0.1"
]

[project.optional-dependencies]
test = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2"
]

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
