name: ALPHA Quant CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test:
    name: Backend Test Suite & Security Audit
    runs-on: ubuntu-latest

    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: alpha_quant_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      - name: Run Database Migrations
        working-directory: ./backend
        env:
          DATABASE_SYNC_URL: postgresql+psycopg://postgres:postgres_ci_password@localhost:5432/alpha_quant_ci
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_password@localhost:5432/alpha_quant_ci
        run: |
          alembic upgrade head

      - name: Execute Full Pytest Suite
        working-directory: ./backend
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          DATABASE_SYNC_URL: sqlite:///:memory:
          ADMIN_API_KEY: alpha-ci-admin-key
          REQUIRE_AUTH: "false"
        run: |
          pytest -v --durations=10

  frontend-build:
    name: Frontend Strict Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Strict TypeScript Verification
        working-directory: ./frontend
        run: npm run typecheck

      - name: Production Vite Bundle Build
        working-directory: ./frontend
        run: npm run build

  docker-verification:
    name: Container Build & Docker Compose Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify Docker Compose Config
        run: |
          docker compose config
